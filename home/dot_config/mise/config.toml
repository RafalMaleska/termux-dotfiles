[tools]
# --- Core Kubernetes & Context Management ---
kubectl = "latest"
helm = "latest"
helmfile = "latest"
k9s = "latest"
kubie = "latest"
kubectx = "latest"
kustomize = "latest"

# --- Kubernetes Debugging, Logs & Inspection ---
stern = "latest"                 # Multi-pod and container log tailing
kubecolor = "latest"             # Colorizes kubectl output
popeye = "latest"                # Kubernetes cluster sanitizer & linter
pluto = "latest"                 # Detects deprecated Kubernetes API versions
velero = "latest"                # Cluster backup and migration CLI

# --- GitOps & Continuous Delivery ---
flux2 = "latest"
argocd = "latest"

# --- Infrastructure as Code & Policy ---
terraform = "latest"
opentofu = "latest"
terragrunt = "latest"
tflint = "latest"                # Terraform linter
tfsec = "latest"                 # Terraform static security scanner
infracost = "latest"             # Cloud cost estimates for Terraform
opa = "latest"                   # Open Policy Agent CLI
conftest = "latest"              # Test structured configs against OPA policies

# --- Security, Secrets & Supply Chain ---
sops = "latest"                  # Encrypted secrets editor
age = "latest"                   # Modern encryption tool for SOPS
trivy = "latest"                 # Container, K8s, and IaC vulnerability scanner
cosign = "latest"                # Container image signing & verification
kubeseal = "latest"              # Bitnami Sealed Secrets CLI

# --- Containers & Local Clusters ---
dive = "latest"                  # Explore Docker/OCI image layers
crane = "latest"                 # Interact with remote image registries
kind = "latest"                  # Kubernetes in Docker (for local testing)
cilium-cli = "latest"            # Cilium CNI & Hubble troubleshooting CLI

# --- Data Wrangling, Templating & Git ---
yq = "latest"                    # jq for YAML (essential for K8s manifests)
jq = "latest"
gomplate = "latest"              # CLI template renderer
gh = "latest"                    # GitHub CLI
lazygit = "latest"               # Terminal UI for Git (integrates with LazyVim)

# --- Runtimes (Required by LazyVim LSPs & Automation) ---
node = "lts"
python = "latest"
go = "latest"
