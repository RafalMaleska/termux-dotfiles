add_newline = true
format = "$directory$git_branch$git_status$kubernetes$python$nodejs$rust$golang$cmd_duration$line_break$character"

[directory]
truncation_length = 4
truncate_to_repo = false

[git_branch]
symbol = " "

[kubernetes]
disabled = false
format = 'on [⛵ $context \($namespace\)](dimmed green) '

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
